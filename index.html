<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="reset.css" />
  </head>
  <body>
    <div class="sign-up-form-container">
      <div class="bg-section">
        <img
          alt="background"
          src="./images/background-image.avif"
          class="background-img"
        />
        <div class="logo-content">
          <img alt="logo" src="./images/odin-lined.png" class="logo" />
          <h1 class="title">ODIN</h1>
        </div>
      </div>
      <div class="form-section">
        <div class="intro-text">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
            <br />
            Sign up <em>now</em> to get started.
          </p>
          <br />
          <p>You <em>know</em> you want to.</p>
        </div>

        <form class="signup-form" id="signup-form" action="#" method="POST">
          <h2>Let's do this!</h2>
          <div class="signup-container">
            <div class="input-group">
              <label for="first-name"> FIRST NAME </label>
              <input type="text" id="first-name" class="type-type" />
            </div>
            <div class="input-group">
              <label for="last-name"> LAST NAME </label>
              <input type="text" id="last-name" class="type-type" />
            </div>
            <div class="input-group">
              <label for="email">EMAIL</label>
              <input type="email" id="email" class="type-type" />
            </div>
            <div class="input-group">
              <label for="tel">PHONE NUMBER</label>
              <input type="tel" id="tel" class="type-type" />
            </div>
            <div class="input-group">
              <label for="password">PASSWORD</label>
              <input
                type="password"
                id="password"
                class="type-type"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                title="Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, and one number."
                required
              />
            </div>
            <div class="input-group">
              <label for="passwordConfirm">CONFIRM PASSWORD</label>
              <input
                type="password"
                id="passwordConfirm"
                class="type-type"
                required
              />
            </div>
          </div>
        </form>

        <div class="form-actions">
          <button form="signup-form" class="btn">Create Account</button>
          <p>Already have an account? <a href="#">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
